name: Deploy to Cloudflare

# 推上 main 就部署；也可以在 Actions 分頁手動跑一次。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

# 連續推很多次時只跑最後一次，避免兩個部署互相覆蓋
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs/ to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 少了 token 就跳過，而不是用一個看不懂的錯誤中斷
      - name: Check credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未設定 secret:$missing —— 跳過 Cloudflare 部署。到 Settings → Secrets and variables → Actions 補上後即可自動部署。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 這個站沒有建置步驟，wrangler.jsonc 裡的 assets.directory 就是 docs/
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
