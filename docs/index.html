<div class="app">
  <div class="scene" id="scene" data-track="road">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hills"></div>
    <div class="ground"></div>
    <div class="piers"></div>
    <div class="track"></div>
    <div class="sea"></div>
    <div class="lane">
      <div class="props" id="props"></div>
      <button class="rider" id="rider" type="button" aria-label="車子"></button>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <button class="mute" id="mute" type="button" aria-label="靜音" aria-pressed="false">🔊</button>
  </div>

  <div class="garage">
    <div class="grid" id="grid"></div>
    <p class="hint">
      點下面的車車叫它出來，再<b>點上面的畫面任何地方</b>，車子就會開到現場工作給你看。右上角 🔊 可以關掉聲音。
